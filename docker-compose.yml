# Scribo — container deployment for CasaOS, Cosmos Cloud, Portainer, Dockge and
# plain `docker compose`.
#
# First run:
#   cp .env.example .env   # then fill in TELEGRAM_TOKEN, ALLOWED_USER_ID, GEMINI_API_KEY
#   docker compose up -d
#
# Named after docker-compose.yml rather than the newer compose.yaml because that
# is the filename every homelab panel's import dialog looks for.

services:
  scribo:
    image: ghcr.io/murqin/scribo:latest
    # Building from a checkout instead of pulling the published image: comment
    # out `image:` above and uncomment the two lines below.
    # build:
    #   context: .
    container_name: scribo
    restart: unless-stopped

    # Secrets and settings come from .env. Compose reads that file host-side and
    # injects the values as environment variables, which the bot prefers over
    # any .env it finds on disk — so nothing sensitive has to be mounted.
    env_file:
      - .env

    # Deliberately no `environment:` block. TZ, PUID and PGID belong in .env
    # alongside everything else, and the image already defaults them (UTC, 1000,
    # 1000). Declaring them here through compose interpolation would be worse
    # than redundant: home server panels scan the file for interpolation syntax
    # and present every match as a field to fill in, without reading the default
    # that follows it — so the import screen asks for three values that already
    # have answers, and a panel that then writes an empty TZ would override the
    # one in .env. Note the syntax is not even written out in this comment, for
    # the same reason: those scanners do not skip comments.

    volumes:
      # Holds modes.json (written on first run, edit it to change prompts and
      # buttons) and scribo_history.jsonl (transcripts, /son, and the memory the
      # spending ceiling is restored from). Losing it hands out a fresh daily
      # allowance, so it is worth backing up.
      - scribo-data:/data
      # Bind mount alternative — CasaOS and Cosmos usually rewrite it to this
      # form anyway. Run `chown -R 1000:1000 ./data` on the host first, or set
      # PUID/PGID in .env to match the directory's owner.
      # - ./data:/data

    # No `ports:`. Scribo reaches Telegram over outbound long polling, so it
    # needs no published port, no domain, no certificate and no reverse proxy
    # entry. Panels that ask for a port during import can be left blank.

    security_opt:
      - no-new-privileges:true

    # The bot idles around 10 MB; the ceiling is here to turn a runaway into a
    # restart instead of a swapping host.
    deploy:
      resources:
        limits:
          memory: 128M

    # Unbounded json-file logs are the usual way a homelab box fills its disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  scribo-data:
