# Scribo — container deployment for CasaOS, Cosmos Cloud, Portainer, Dockge and
# plain `docker compose`.
#
# First run:
#   cp .env.example .env   # then fill in TELEGRAM_TOKEN, ALLOWED_USER_ID, GEMINI_API_KEY
#   docker compose up -d
#
# Named after docker-compose.yml rather than the newer compose.yaml because that
# is the filename every homelab panel's import dialog looks for.

services:
  scribo:
    image: ghcr.io/murqin/scribo:latest
    # Building from a checkout instead of pulling the published image: comment
    # out `image:` above and uncomment the two lines below.
    # build:
    #   context: .
    container_name: scribo
    restart: unless-stopped

    # Settings come from .env. Compose reads it host-side and injects the values
    # as environment variables, which the bot prefers over any .env it finds on
    # disk — so nothing sensitive has to be mounted.
    #
    # required: false because home server panels import this file on its own,
    # with no .env next to it, and supply the values through their own form
    # instead. Without it the stack refuses to start for exactly those users.
    env_file:
      - path: .env
        required: false

    # Only the three settings that have no sensible default are declared here.
    # A panel builds its import form from this list, so this is the one channel
    # through which a panel user can supply them at all — but the list is kept
    # to what genuinely has no answer. TZ, PUID and PGID are deliberately absent:
    # the image already defaults them (UTC, 1000, 1000), so asking would present
    # answered settings as blanks, and a panel writing an empty TZ would put the
    # daily spending cap back on UTC midnight.
    #
    # Anything else from .env.example — OPENROUTER_API_KEY, SCRIBO_LANG, the
    # spending ceilings — can be added as an extra environment variable in the
    # panel, or simply left to its default.
    #
    # Do not grow this list casually. A variable declared here is *set* even when
    # it resolves to nothing, and HISTORY_FILE reads an empty value as "keep no
    # history" rather than "use the default" — declaring it would silently turn
    # off both the transcript history and the spending ceiling's memory for
    # everyone who did not fill the field in.
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      ALLOWED_USER_ID: ${ALLOWED_USER_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

    volumes:
      # Holds modes.json (written on first run, edit it to change prompts and
      # buttons) and scribo_history.jsonl (transcripts, /son, and the memory the
      # spending ceiling is restored from). Losing it hands out a fresh daily
      # allowance, so it is worth backing up.
      - scribo-data:/data
      # Bind mount alternative — CasaOS and Cosmos usually rewrite it to this
      # form anyway. Run `chown -R 1000:1000 ./data` on the host first, or set
      # PUID/PGID in .env to match the directory's owner.
      # - ./data:/data

    # No `ports:`. Scribo reaches Telegram over outbound long polling, so it
    # needs no published port, no domain, no certificate and no reverse proxy
    # entry. Panels that ask for a port during import can be left blank.

    security_opt:
      - no-new-privileges:true

    # The bot idles around 10 MB; the ceiling is here to turn a runaway into a
    # restart instead of a swapping host.
    deploy:
      resources:
        limits:
          memory: 128M

    # Unbounded json-file logs are the usual way a homelab box fills its disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  scribo-data:
